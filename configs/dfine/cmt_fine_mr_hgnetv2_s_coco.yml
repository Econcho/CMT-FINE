__include__: [
  './dfine_hgnetv2_s_coco.yml',
]

output_dir: ./output/cmt_fine_mr_hgnetv2_s_coco

DFINE:
  cmt: CMTMomentRefiner

CMTMomentRefiner:
  enabled: True
  mode: full                 # baseline/evidence_only/mass_only/first_order/full
  hidden_dim: 256            # must match DFINETransformer.hidden_dim
  evidence_channels: 16
  evidence_activation: softplus
  base_stride: 4
  num_moment_levels: 4
  support_scales: [0.75, 1.5, 3.0]
  min_radius_px: 4.0
  reg_max: 32                # must match DFINETransformer.reg_max
  projection_strength: 1.0
  solver_steps: 4
  learned_gate: True
  fixed_gate: 0.5
  class_residual: True       # q + alpha * MLP(moment descriptor) for class scores
  class_residual_init: 0.01
  refine_layers: all         # all/last or an explicit list, e.g. [2]

DFINECriterion:
  weight_dict:
    loss_cmt_evidence: 0.25
    loss_cmt_center: 0.10
    loss_cmt_gate: 0.05
  losses: ['vfl', 'boxes', 'local', 'cmt']
